<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyBrowser Test Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to PyBrowser!</h1>
        <p>This page uses native HTML and CSS. The JavaScript engine has been bypassed. The button below communicates directly with a native Python function.</p>
        
        <!-- Python execution block (will be executed and stripped by PyBrowser) -->
        <script type="text/python">
import os
import platform

def fetch_system_data():
    sys_info = f"OS: {platform.system()} {platform.release()}, Python: {platform.python_version()}"
    print(f"\\n--- System Data Fetched ---")
    print(sys_info)
    print("---------------------------\\n")

print("PyBrowser native context initialized. `fetch_system_data` is ready.")
        </script>

        <!-- A standard JS script that will be stripped to prove JS is disabled -->
        <script>
            alert("If you see this, the JS stripping failed!");
        </script>

        <!-- Button triggering the native Python function -->
        <button onclick="python:fetch_system_data()">Fetch System Data (Python)</button>
    </div>
</body>
</html>
